<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4CAF50">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>성공회 사목예식서</title>
  <link rel="manifest" href="manifest.json">

  <style>

    #startGuide { margin:18px 12px 24px; text-align:center; }
    .start-notice-box { display:inline-block; max-width:560px; text-align:left; background:#fafafa;
      border:1px dashed #bbb; border-radius:10px; padding:20px 24px; color:#555;
      font-size:1.05em; line-height:1.7; box-shadow:0 1px 4px rgba(0,0,0,.06); }
    .start-notice-title { color:#228b22; font-weight:700; text-align:center; margin-bottom:8px; }
    .start-button-row { display:flex; justify-content:center; gap:12px; margin-top:26px; }
    .start-action-btn { border:0; border-radius:8px; padding:13px 24px; font-size:1.05em;
      cursor:pointer; color:white; background:#228b22; }
    .start-action-btn.install { background:#4b0082; }
    .start-action-btn:disabled { background:#999; color:#eee; cursor:default; opacity:.75; }
    /* 시작 전에는 실제 메뉴를 숨기고, 상단바는 비활성 상태로 보이게 함 */
    body.start-screen .menu-container { display:none; }
    body:not(.start-screen) #startGuide { display:none; }

    body.start-screen .navbar {
      filter: grayscale(1);
      opacity: .38;
      pointer-events: none;
    }

    body.start-screen .side-menu {
      pointer-events: none;
    }

    /* 시작 안내와 두 버튼은 항상 선명하고 조작 가능 */
    body.start-screen #startGuide {
      position: relative;
      z-index: 1100;
    }
  </style>
</head>

<body class="start-screen">


  <div id="startGuide">
    <div class="start-notice-box">
      <div class="start-notice-title">⭐️ 사용 안내 ⭐️</div>
      <div>
        ● 아래 <b>[시작]</b> 버튼을 누르면 기도서 메뉴가 열립니다.<br>
        ● 원하는 예식이나 기도문을 선택하여 사용할 수 있습니다.<br>
        ● 절기에 따른 특정문은 <b>책갈피</b> 기능으로 바로 찾아갈 수 있습니다.<br>
        ● 앱으로 사용하려면 <b>[앱 설치]</b> 버튼을 눌러 설치하세요.<br>
        ● 자세한 사용법은 메뉴의 <b>사용안내</b>를 참고하세요.
      </div>
    </div>
    <div class="start-button-row">
      <button id="startKbcpBtn" class="start-action-btn" type="button">시작</button>
      <button id="startInstallBtn" class="start-action-btn install" type="button" disabled>앱 설치</button>
    </div>
  </div>

  <div class="menu-container">
    <a href="daily-office-select.html" class="menu-button">1. 성무일과</a>
    <a href="ucharist-select.html" class="menu-button">2. 감사성찬례</a>
    <a href="sacrament-select.html" class="menu-button">3. 성사예식</a>
    <a href="pastoral-select.html" class="menu-button">4. 사목예식</a>
    <a href="holyday-select.html" class="menu-button">5. 월별축일표</a>
    <a href="all-proper-select.html" class="menu-button">6. 특정문 바로보기</a>
    <a href="main-prayer-select.html" class="menu-button">8. 주요기도문</a>
    <a href="outline-list.html" class="menu-button">9. 신앙의 개요</a>
  </div>
  </br>
  </br>
  </br>
  <script src="main.js" defer></script>

  <script>
  /**** 시작화면 / 메뉴화면 / 종료 제어 ****/
  const params = new URLSearchParams(location.search);
  const started = params.get("started") === "1";

  // ?started=1 이면 실제 메뉴화면으로 표시
  if (started) {
    document.body.classList.remove("start-screen");
  }

  // 시작 버튼은 같은 화면의 class만 바꾸지 않고 실제 URL 이동을 만든다.
  // 이렇게 해야 뒤로가기 때 브라우저가 시작화면(index.html)으로 확실히 돌아간다.
  window.addEventListener("DOMContentLoaded", () => {
    const startBtn = document.getElementById("startKbcpBtn");
    if (startBtn) {
      startBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopImmediatePropagation();
        location.href = "index.html?started=1";
      }, true);
    }
  });

  // 종료 메시지는 시작화면에서만 성가앱과 같은 방식으로 처리
  let lastBackPress = 0;
  let toastTimer = null;

  function showToast(message) {
    let toast = document.getElementById("back-toast");
    if (!toast) {
      toast = document.createElement("div");
      toast.id = "back-toast";
      toast.style.position = "fixed";
      toast.style.bottom = "60px";
      toast.style.left = "50%";
      toast.style.transform = "translateX(-50%)";
      toast.style.background = "rgba(0,0,0,.8)";
      toast.style.color = "white";
      toast.style.padding = "10px 20px";
      toast.style.borderRadius = "20px";
      toast.style.fontSize = "1em";
      toast.style.whiteSpace = "nowrap";
      toast.style.zIndex = "9999";
      toast.style.opacity = "0";
      toast.style.transition = "opacity .3s";
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.style.opacity = "1";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.style.opacity = "0", 1500);
  }

  if (!started) {
    window.addEventListener("popstate", () => {
      const now = Date.now();
      if (now - lastBackPress < 2000) {
        history.back();
      } else {
        showToast("한 번 더 누르면 종료합니다.");
        lastBackPress = now;
        history.pushState(null, null, location.href);
      }
    });

    // 시작화면의 뒤로가기 감지용 history 한 칸
    history.pushState(null, null, location.href);
  }
</script>

</body>

</html>
